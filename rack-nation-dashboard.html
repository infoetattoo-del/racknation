<style>
  *{ margin:0;padding:0;box-sizing:border-box; }
  :root {
    --bg: #0a0a0a;
    --panel: #0f0f0f;
    --border: #1a1a1a;
    --accent: #e8ff00;
    --muted: #555;
    --text: #ccc;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  #dash-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  #dash-logo {
    height: 36px;
    cursor: pointer;
  }
  #dash-nav {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .nav-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    padding: 6px 14px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.primary {
    background: var(--accent);
    color: #0a0a0a;
    border-color: var(--accent);
    font-weight: bold;
  }
  .nav-btn.primary:hover { background: #fff; }
  #dash-username {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 2px;
  }

  /* ── MAIN ── */
  #dash-main {
    flex: 1;
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 0;
    overflow: hidden;
  }

  /* ── SIDEBAR ── */
  #dash-sidebar {
    border-right: 1px solid var(--border);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    overflow-y: auto;
  }

  /* Avatar + profil */
  .profile-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: #111;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    position: relative;
    overflow: hidden;
  }
  .avatar-letter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 36px;
    color: var(--accent);
  }
  .profile-tag {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 2px;
  }
  .profile-joined {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .profile-plan {
    font-size: 9px;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 3px 10px;
    letter-spacing: 2px;
  }
  .profile-plan.pro {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Level badge */
  .level-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .level-label {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .level-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #111;
    border: 1px solid var(--border);
    padding: 12px 16px;
  }
  .level-icon { font-size: 28px; }
  .level-info { flex: 1; }
  .level-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    color: var(--accent);
    letter-spacing: 2px;
    line-height: 1;
  }
  .level-pts {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 2px;
  }
  .xp-bar-wrap {
    background: #111;
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }
  .xp-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #a0b800);
    border-radius: 2px;
    transition: width 0.8s ease;
  }
  .xp-next {
    font-size: 8px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-top: 4px;
  }

  /* Stats */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .stat-card {
    background: #111;
    border: 1px solid var(--border);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: var(--accent);
    line-height: 1;
  }
  .stat-lbl {
    font-size: 8px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ── CONTENT ── */
  #dash-content {
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .section-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 4px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
    margin-bottom: 16px;
  }

  /* Enter the spot CTA */
  .enter-spot-btn {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    padding: 20px 40px;
    cursor: pointer;
    width: 100%;
    transition: background 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  .enter-spot-btn:hover { background: #fff; }
  .enter-spot-btn .arrow { font-size: 28px; }

  /* Graffs grid */
  .graffs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }
  .graff-card {
    background: #0f0f0f;
    border: 1px solid var(--border);
    overflow: hidden;
    position: relative;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .graff-card:hover { border-color: #333; }
  .graff-card img {
    width: 100%;
    aspect-ratio: 2/1;
    object-fit: cover;
    display: block;
  }
  .graff-card-info {
    padding: 8px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .graff-spot { font-size: 9px; color: var(--muted); letter-spacing: 1px; }
  .graff-date { font-size: 9px; color: #333; }
  .graff-likes { font-size: 10px; color: var(--muted); }

  /* Free limit banner */
  .free-banner {
    background: #111;
    border: 1px solid #222;
    border-left: 3px solid var(--accent);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .free-banner-text { font-size: 11px; color: var(--muted); line-height: 1.6; }
  .free-banner-text span { color: var(--accent); }
  .upgrade-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    padding: 8px 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
  }
  .upgrade-btn:hover { background: var(--accent); color: #0a0a0a; }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
    border: 1px dashed #1a1a1a;
  }
  .empty-state-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.5; }

  /* Loading */
  #dash-loading {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
    gap: 16px;
  }
  .loading-dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-block;
    animation: bounce 1s infinite;
  }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%,100% { transform: translateY(0); opacity:0.3; }
    50% { transform: translateY(-8px); opacity:1; }
  }
  .loading-text { font-size: 10px; color: var(--muted); letter-spacing: 3px; }

  /* Lightbox */
  #lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 2000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 90vw;
    max-height: 80vh;
    object-fit: contain;
    border: 1px solid #222;
  }
  #lightbox-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: 1px solid #333;
    color: #888;
    font-size: 20px;
    cursor: pointer;
    padding: 6px 14px;
    font-family: monospace;
    transition: all 0.15s;
  }
  #lightbox-close:hover { border-color: #e8ff00; color: #e8ff00; }
  #lightbox-info { font-size: 10px; color: #555; letter-spacing: 2px; font-family: 'Share Tech Mono', monospace; }


  .graff-delete {
    position: absolute;
    top: 6px;
    right: 6px;
    background: rgba(0,0,0,0.7);
    border: 1px solid #333;
    color: #666;
    font-size: 11px;
    padding: 3px 8px;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 1px;
    transition: all 0.15s;
    z-index: 10;
  }
  .graff-delete:hover {
    background: rgba(255,50,50,0.8);
    border-color: #ff3333;
    color: #fff;
  }
  .graff-card { position: relative; }

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var SUPA_URL = 'https://lxotohgaojnrzmpaxeqc.supabase.co';
var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4b3RvaGdhb2pucnptcGF4ZXFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTMwNjYsImV4cCI6MjA5MzY2OTA2Nn0.B1u8-q8Ilc9BQ8Pkw9b-IlBxrgCEbXtCP-XihcFTOQU';
var supa, currentUser, currentProfile;

// Niveaux
var LEVELS = [
  { name: 'TOY',         color:'#555',    min: 0,     max: 100   },
  { name: 'BOMBER',      color:'#888',    min: 100,   max: 500   },
  { name: 'ROOKIE',      color:'#aaa',    min: 500,   max: 1500  },
  { name: 'WRITER',      color:'#e8ff00', min: 1500,  max: 4000  },
  { name: 'STREET CRED', color:'#e8ff00', min: 4000,  max: 8000  },
  { name: 'VANDAL',      color:'#ff6600', min: 8000,  max: 15000 },
  { name: 'KING',        color:'#e8ff00', min: 15000, max: 99999 },
];

function getLevel(pts) {
  for (var i = LEVELS.length - 1; i >= 0; i--) {
    if (pts >= LEVELS[i].min) return { ...LEVELS[i], idx: i };
  }
  return { ...LEVELS[0], idx: 0 };
}

window.addEventListener('load', async function() {
  supa = window.supabase.createClient(SUPA_URL, SUPA_KEY);
  var session = await supa.auth.getSession();
  if (!session.data.session) {
    window.location.href = 'rack-nation-landing.html';
    return;
  }
  currentUser = session.data.session.user;
  await loadProfile();
  await loadGraffs();
  document.getElementById('dash-loading').style.display = 'none';
});

async function loadProfile() {
  var r = await supa.from('profiles').select('*').eq('id', currentUser.id).single();
  if (!r.data) { window.location.href = 'rack-nation-landing.html'; return; }
  currentProfile = r.data;

  var tag = currentProfile.username || 'VANDAL';
  var pts = currentProfile.points || 0;
  var joined = new Date(currentProfile.created_at).toLocaleDateString('en-US', {month:'short', year:'numeric'});

  document.getElementById('avatar-letter').textContent = tag[0].toUpperCase();
  document.getElementById('profile-tag').textContent = tag.toUpperCase();
  document.getElementById('profile-joined').textContent = 'Joined ' + joined;
  document.getElementById('dash-username').textContent = tag.toUpperCase();

  var plan = currentProfile.is_pro ? 'PRO' : 'FREE';
  var planEl = document.getElementById('profile-plan');
  planEl.textContent = plan;
  if (currentProfile.is_pro) {
    planEl.classList.add('pro');
    document.getElementById('free-banner').style.display = 'none';
  }

  // Level
  var lvl = getLevel(pts);
  var next = LEVELS[Math.min(lvl.idx + 1, LEVELS.length - 1)];
  var pct = lvl.idx === LEVELS.length - 1 ? 100 :
    Math.round(((pts - lvl.min) / (next.min - lvl.min)) * 100);

  document.getElementById('level-icon').innerHTML = '<div style="width:36px;height:36px;border:2px solid ' + lvl.color + ';border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:Bebas Neue,sans-serif;font-size:11px;color:' + lvl.color + ';letter-spacing:1px;">' + lvl.name[0] + '</div>';
  document.getElementById('level-name').textContent = lvl.name;
  document.getElementById('level-name').style.color = lvl.color;
  document.getElementById('xp-bar').style.background = 'linear-gradient(90deg,' + lvl.color + ', #a0b800)';
  document.getElementById('level-pts').textContent = pts + ' pts';
  document.getElementById('xp-bar').style.width = pct + '%';
  document.getElementById('xp-next').textContent = lvl.idx === LEVELS.length - 1
    ? 'MAX LEVEL' : (next.min - pts) + ' pts to ' + next.name;
  document.getElementById('stat-pts').textContent = pts;
  // Avatar
  if (currentProfile.avatar_url) {
    var wrap = document.getElementById('avatar-wrap');
    wrap.style.backgroundImage = 'url(' + currentProfile.avatar_url + ')';
    wrap.style.backgroundSize = 'cover';
    document.getElementById('avatar-letter').style.display = 'none';
  }
}

// Event delegation pour les boutons delete
document.addEventListener('click', function(e) {
  var btn = e.target.closest('.graff-delete');
  if (!btn) return;
  e.stopPropagation();
  e.preventDefault();
  var id = btn.getAttribute('data-id');
  var url = btn.getAttribute('data-url');
  if (id && url) deleteGraff(id, url);
});

async function loadGraffs() {
  var r = await supa.from('gallery')
    .select('*')
    .eq('user_id', currentUser.id)
    .order('created_at', {ascending: false})
    .limit(20);

  var graffs = r.data || [];
  document.getElementById('stat-graffs').textContent = graffs.length;
  var isPro = currentProfile && currentProfile.is_pro;
  var maxGraffs = isPro ? 50 : 3;
  document.getElementById('graff-count').textContent = graffs.length + '/' + maxGraffs;

  // Spots uniques
  var spots = new Set(graffs.map(function(g) { return g.city; }));
  document.getElementById('stat-spots').textContent = spots.size;

  // Total likes
  var likes = graffs.reduce(function(acc, g) { return acc + (g.likes || 0); }, 0);
  document.getElementById('stat-likes').textContent = likes;

  var grid = document.getElementById('my-graffs-grid');

  if (graffs.length === 0) {
    grid.innerHTML = '<div class="empty-state">NO GRAFFS YET<br><br>Enter a spot and leave your mark.</div>';
    return;
  }

  grid.innerHTML = graffs.map(function(g) {
    var date = new Date(g.created_at).toLocaleDateString('en-US', {month:'short', day:'numeric'});
    return '<div class="graff-card" style="position:relative;">' +
      '<img src="' + g.image_url + '" loading="lazy" alt="' + g.spot + '" onclick="openLightbox(this.src,\''+g.spot+'\')" style="cursor:pointer;width:100%;aspect-ratio:2/1;object-fit:cover;display:block;">' +
      '<div class="graff-card-info">' +
        '<div class="graff-spot">' + g.spot + ' · ' + date + '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;">' +
          '<span class="graff-likes">♥ ' + (g.likes||0) + '</span>' +
          '<button onclick="deleteGraff(\''+g.id+'\',\''+g.image_url+'\')" style="background:transparent;border:1px solid #ff3333;color:#ff3333;font-family:monospace;font-size:9px;padding:2px 8px;cursor:pointer;margin-left:auto;">✕ DEL</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}


async function uploadAvatar(input) {
  if (!input.files || !input.files[0]) return;
  var file = input.files[0];
  if (file.size > 500000) { alert('Image too large (max 500KB)'); return; }
  
  // Resize to 100x100
  var canvas = document.createElement('canvas');
  canvas.width = 100; canvas.height = 100;
  var ctx = canvas.getContext('2d');
  var img = new Image();
  img.onload = async function() {
    ctx.drawImage(img, 0, 0, 100, 100);
    canvas.toBlob(async function(blob) {
      var path = currentUser.id + '/avatar.jpg';
      var r = await supa.storage.from('graffs').upload(path, blob, {contentType:'image/jpeg', upsert:true});
      if (r.error) { console.error(r.error); return; }
      var url = SUPA_URL + '/storage/v1/object/public/graffs/' + path;
      await supa.from('profiles').update({avatar_url: url}).eq('id', currentUser.id);
      // Afficher
      var wrap = document.getElementById('avatar-wrap');
      wrap.style.backgroundImage = 'url(' + url + ')';
      wrap.style.backgroundSize = 'cover';
      document.getElementById('avatar-letter').style.display = 'none';
    }, 'image/jpeg', 0.85);
  };
  img.src = URL.createObjectURL(file);
}



async function deleteGraff(id, imageUrl) {
  if (!confirm('Delete this graff?')) return;
  
  // Extraire le nom du fichier depuis l'URL
  var fileName = imageUrl.split('/graffs/').pop();
  
  // Supprimer du storage
  if (fileName) {
    await supa.storage.from('graffs').remove([fileName]);
  }
  
  // Supprimer de la gallery
  var r = await supa.from('gallery').delete().eq('id', id).eq('user_id', currentUser.id);
  if (r.error) {
    alert('Error: ' + r.error.message);
    return;
  }
  
  // Rafraîchir la galerie
  await loadGraffs();
}

function openLightbox(url, info) {
  document.getElementById('lightbox-img').src = url;
  document.getElementById('lightbox-info').textContent = info || '';
  document.getElementById('lightbox').classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});

function goToSpot() {
  window.location.href = 'rack-nation.html';
}

function doLogout() {
  supa.auth.signOut().then(function() {
    window.location.href = 'rack-nation-landing.html';
  });
}

function showUpgrade() {
  alert('PRO plan coming soon! 🚀');
}
</script>

<div id="lightbox" onclick="closeLightbox()">
  <button id="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightbox-img" src="" alt="">
  <div id="lightbox-info"></div>
</div>
